
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - Special Edition</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:24px 12px;min-height:100vh;
 display:flex;justify-content:center;
 background:linear-gradient(135deg,#fff8e8,#f5e6ff);
 color:#776e65;font-family:Arial,sans-serif;
}
main{width:min(100%,480px)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:65px;margin:0;color:#edb92e;font-weight:900;text-shadow:2px 3px #fff}
.scores{display:flex;gap:7px}
.scorebox{
 background:#8f7a66;color:white;border-radius:9px;
 padding:8px 12px;text-align:center;min-width:75px;
 box-shadow:0 3px 8px #0002
}
.scorebox small{display:block;font-size:11px}
.scorebox span{font-size:23px;font-weight:bold}
.topline{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
button{
 border:0;border-radius:9px;background:#8f7a66;color:white;
 padding:12px 15px;font-weight:bold;cursor:pointer;
 box-shadow:0 3px 7px #0002
}
button:active{transform:scale(.96)}
.board-wrap{
 position:relative;background:#bbada0;padding:10px;border-radius:13px;
 touch-action:none;user-select:none;
 box-shadow:0 8px 22px #0002
}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cell{
 aspect-ratio:1;border-radius:7px;background:#cdc1b4;
 display:flex;align-items:center;justify-content:center;
 font-size:clamp(24px,7vw,42px);font-weight:900;
 position:relative;color:#776e65
}
.cell[data-value="2"]{background:#eee4da}
.cell[data-value="4"]{background:#ede0c8}
.cell[data-value="8"]{background:#f2b179;color:white}
.cell[data-value="16"]{background:#f59563;color:white}
.cell[data-value="32"]{background:#f67c5f;color:white}
.cell[data-value="64"]{background:#f65e3b;color:white}
.cell[data-value="128"]{background:#edcf72;color:white;font-size:30px}
.cell[data-value="256"]{background:#edcc61;color:white;font-size:30px}
.cell[data-value="512"]{background:#edc850;color:white;font-size:30px}
.cell[data-value="1024"]{background:#edc53f;color:white;font-size:25px}
.cell[data-value="2048"]{background:#edc22e;color:white;font-size:25px}
.cell.high{background:#3c3a32;color:white;font-size:25px}

/* 合体アニメーション */
.cell.merge-pop{
 z-index:3;
 border:3px solid #fff6a5;
 animation:mergePop .5s cubic-bezier(.2,1.8,.4,1);
 box-shadow:0 0 15px 6px #fff4a8,0 0 32px 12px #ffbd24;
}
@keyframes mergePop{
 0%{transform:scale(.65) rotate(-8deg);filter:brightness(1)}
 35%{transform:scale(1.4) rotate(6deg);filter:brightness(2)}
 65%{transform:scale(.9) rotate(-3deg);filter:brightness(1.5)}
 100%{transform:scale(1) rotate(0);filter:brightness(1)}
}
.cell.merge-pop::after{
 content:"✦";
 position:absolute;
 top:-12px;right:-7px;
 color:#fff;
 font-size:28px;
 text-shadow:0 0 9px gold;
 animation:sparkle .55s ease-out forwards;
 pointer-events:none;
}
@keyframes sparkle{
 0%{transform:scale(.2) rotate(0);opacity:0}
 40%{transform:scale(1.8) rotate(100deg);opacity:1}
 100%{transform:scale(.2) rotate(220deg);opacity:0}
}
.board-wrap.merge-shake{animation:shake .3s}
@keyframes shake{
 0%,100%{transform:translateX(0)}
 20%{transform:translateX(-5px)}
 40%{transform:translateX(5px)}
 60%{transform:translateX(-3px)}
 80%{transform:translateX(3px)}
}

/* キラキラ粒子 */
.particle{
 position:absolute;z-index:5;pointer-events:none;
 font-size:22px;color:#ffe45c;
 animation:particleFly .75s ease-out forwards;
}
@keyframes particleFly{
 0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}
 100%{transform:translate(var(--dx),var(--dy)) scale(1.3) rotate(180deg);opacity:0}
}
.overlay{
 position:absolute;inset:0;border-radius:13px;
 background:#fff2d9ed;display:none;
 align-items:center;justify-content:center;
 flex-direction:column;text-align:center;padding:20px;
 z-index:10
}
.overlay.show{display:flex;animation:overlayIn .35s ease-out}
@keyframes overlayIn{
 from{opacity:0;transform:scale(.8)}
 to{opacity:1;transform:scale(1)}
}
.overlay h2{font-size:38px;color:#d69c18;margin:0 0 10px}
.overlay p{margin:0 0 18px;line-height:1.5}
.help{font-size:14px;line-height:1.6;margin-top:18px}
.mobile-controls{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:7px;width:190px;margin:16px auto
}
.mobile-controls button{font-size:21px;padding:12px}
.mobile-controls button:nth-child(1){grid-column:2}
.mobile-controls button:nth-child(2){grid-column:1;grid-row:2}
.mobile-controls button:nth-child(3){grid-column:2;grid-row:2}
.mobile-controls button:nth-child(4){grid-column:3;grid-row:2}
footer{text-align:center;font-size:12px;margin-top:18px}
@media(min-width:600px){.mobile-controls{display:none}}
</style>
</head>
<body>
<main>
<header>
<h1>2048</h1>
<div class="scores">
<div class="scorebox"><small>SCORE</small><span id="score">0</span></div>
<div class="scorebox"><small>BEST</small><span id="best">0</span></div>
</div>
</header>

<div class="topline">
<strong>✨ 2048を目指そう！</strong>
<button id="restart">新しく始める</button>
</div>

<section class="board-wrap">
<div class="board" id="board"></div>
<div class="overlay" id="overlay">
<h2 id="overlay-title"></h2>
<p id="overlay-text"></p>
<button id="overlay-button">もう一度遊ぶ</button>
</div>
</section>

<div class="mobile-controls">
<button data-dir="up">↑</button>
<button data-dir="left">←</button>
<button data-dir="down">↓</button>
<button data-dir="right">→</button>
</div>

<div class="help">
<strong>遊び方</strong><br>
矢印キー・WASD・スマホのスワイプで操作。同じ数字を合わせると合体！合体時には豪華なエフェクトが発生するよ。2048を作ろう！
</div>
<footer>2048 SPECIAL EDITION ✨</footer>
</main>

<script>
(()=>{
 const SIZE=4;
 const boardEl=document.getElementById('board');
 const scoreEl=document.getElementById('score');
 const bestEl=document.getElementById('best');
 const overlay=document.getElementById('overlay');
 const wrap=document.querySelector('.board-wrap');

 let grid,score,best=Number(localStorage.getItem('2048-best')||0);
 let over=false,won=false;

 bestEl.textContent=best;

 const empty=()=>Array.from({length:SIZE},()=>Array(SIZE).fill(0));

 function spawn(){
   const spaces=[];
   for(let r=0;r<SIZE;r++)
     for(let c=0;c<SIZE;c++)
       if(!grid[r][c])spaces.push([r,c]);

   if(!spaces.length)return;

   const [r,c]=spaces[Math.floor(Math.random()*spaces.length)];
   grid[r][c]=Math.random()<.9?2:4;
 }

 function particles(cell){
   const rect=cell.getBoundingClientRect();
   const parent=wrap.getBoundingClientRect();

   for(let i=0;i<9;i++){
     const p=document.createElement('span');
     p.className='particle';
     p.textContent=['✦','✨','★','✧'][i%4];
     p.style.left=(rect.left-parent.left+rect.width/2)+'px';
     p.style.top=(rect.top-parent.top+rect.height/2)+'px';
     p.style.setProperty('--dx',(Math.random()*100-50)+'px');
     p.style.setProperty('--dy',(Math.random()*100-50)+'px');
     wrap.appendChild(p);
     setTimeout(()=>p.remove(),800);
   }
 }

 function render(mergedCells=[]){
   boardEl.innerHTML='';

   for(let r=0;r<SIZE;r++){
     for(let c=0;c<SIZE;c++){
       const v=grid[r][c];
       const cell=document.createElement('div');
       const merged=mergedCells.some(p=>p[0]===r&&p[1]===c);

       cell.className='cell'+(v>2048?' high':'')+(merged?' merge-pop':'');
       if(v)cell.dataset.value=String(v);
       cell.textContent=v||'';
       cell.setAttribute('role','gridcell');
       boardEl.appendChild(cell);

       if(merged){
         particles(cell);
       }
     }
   }

   scoreEl.textContent=score;
   bestEl.textContent=best;

   if(mergedCells.length){
     wrap.classList.remove('merge-shake');
     void wrap.offsetWidth;
     wrap.classList.add('merge-shake');
   }
 }

 function start(){
   grid=empty();
   score=0;
   over=false;
   won=false;
   overlay.classList.remove('show');
   spawn();
   spawn();
   render();
 }

 function slideLine(line){
   const values=line.filter(Boolean);
   const out=[];
   const mergedIndices=[];
   let gained=0;

   for(let i=0;i<values.length;i++){
     if(values[i]===values[i+1]){
       const merged=values[i]*2;
       mergedIndices.push(out.length);
       out.push(merged);
       gained+=merged;
       i++;
     }else{
       out.push(values[i]);
     }
   }

   while(out.length<SIZE)out.push(0);
   return {line:out,gained,mergedIndices};
 }

 function move(dir){
   if(over)return;

   const next=empty();
   let gained=0;
   const mergedCells=[];

   for(let i=0;i<SIZE;i++){
     let line=[];

     for(let j=0;j<SIZE;j++){
       line.push(
         dir==='left'?grid[i][j]:
         dir==='right'?grid[i][SIZE-1-j]:
         dir==='up'?grid[j][i]:
         grid[SIZE-1-j][i]
       );
     }

     const result=slideLine(line);
     gained+=result.gained;

     for(let j=0;j<SIZE;j++){
       const r=dir==='left'||dir==='right'?i:
               dir==='up'?j:SIZE-1-j;
       const c=dir==='up'||dir==='down'?i:
               dir==='left'?j:SIZE-1-j;
       next[r][c]=result.line[j];
     }

     result.mergedIndices.forEach(j=>{
       const r=dir==='left'||dir==='right'?i:
               dir==='up'?j:SIZE-1-j;
       const c=dir==='up'||dir==='down'?i:
               dir==='left'?j:SIZE-1-j;
       mergedCells.push([r,c]);
     });
   }

   if(next.every((row,r)=>row.every((v,c)=>v===grid[r][c])))return;

   grid=next;
   score+=gained;

   if(score>best){
     best=score;
     localStorage.setItem('2048-best',String(best));
   }

   spawn();
   render(mergedCells);

   if(!won&&grid.some(row=>row.includes(2048))){
     won=true;
     showOverlay(
       '🎉 2048達成！',
       '✨ おめでとう！すごい！ ✨',
       '続けて遊ぶ',
       true
     );
   }else if(!canMove()){
     over=true;
     showOverlay(
       'ゲームオーバー',
       'もう一度チャレンジしてみよう！',
       'もう一度遊ぶ'
     );
   }
 }

 function canMove(){
   for(let r=0;r<SIZE;r++){
     for(let c=0;c<SIZE;c++){
       if(!grid[r][c])return true;
       if(c<SIZE-1&&grid[r][c]===grid[r][c+1])return true;
       if(r<SIZE-1&&grid[r][c]===grid[r+1][c])return true;
     }
   }
   return false;
 }

 function showOverlay(title,msg,button,continueMode=false){
   document.getElementById('overlay-title').textContent=title;
   document.getElementById('overlay-text').textContent=msg;
   const b=document.getElementById('overlay-button');
   b.textContent=button;
   b.onclick=()=>{
     overlay.classList.remove('show');
     if(!continueMode)start();
   };
   overlay.classList.add('show');
 }

 const keys={
   ArrowUp:'up',ArrowDown:'down',
   ArrowLeft:'left',ArrowRight:'right',
   w:'up',s:'down',a:'left',d:'right'
 };

 document.addEventListener('keydown',e=>{
   if(keys[e.key]){
     e.preventDefault();
     move(keys[e.key]);
   }else if(e.key.toLowerCase()==='r'){
     start();
   }
 });

 document.getElementById('restart').addEventListener('click',start);

 document.querySelectorAll('[data-dir]').forEach(b=>{
   b.addEventListener('click',()=>move(b.dataset.dir));
 });

 let touch=null;

 wrap.addEventListener('touchstart',e=>{
   const t=e.changedTouches[0];
   touch=[t.clientX,t.clientY];
 },{passive:true});

 wrap.addEventListener('touchend',e=>{
   if(!touch)return;
   const t=e.changedTouches[0];
   const dx=t.clientX-touch[0];
   const dy=t.clientY-touch[1];
   touch=null;

   if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;

   move(Math.abs(dx)>Math.abs(dy)?
     (dx>0?'right':'left'):
     (dy>0?'down':'up'));
 },{passive:true});

 start();
})();
</script>
</body>
</html>
