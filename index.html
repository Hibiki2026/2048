
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf8ef">
<title>2048 - Number Puzzle</title>
<style>
:root{--bg:#faf8ef;--ink:#776e65;--board:#bbada0;--empty:#cdc1b4;--accent:#edc22e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center;padding:28px 14px}
main{width:min(100%,500px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:clamp(42px,12vw,68px);line-height:1;margin:0;font-weight:850;letter-spacing:-4px}
.scores{display:flex;gap:8px}
.scorebox{background:#bbada0;color:white;border-radius:7px;padding:8px 13px;min-width:78px;text-align:center;font-weight:800}
.scorebox small{display:block;font-size:11px;letter-spacing:1px;opacity:.85}
.scorebox span{font-size:23px}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 16px}
p{margin:0;font-size:15px;line-height:1.45}
button{border:0;border-radius:7px;background:#8f7a66;color:white;font-weight:800;padding:11px 15px;font-size:14px;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:3px solid #edc22e;outline-offset:3px}
.board-wrap{position:relative;background:var(--board);padding:10px;border-radius:9px;touch-action:none;user-select:none}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{aspect-ratio:1;background:var(--empty);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:clamp(25px,7vw,43px);font-weight:850;letter-spacing:-1px;color:#776e65;transition:background .08s}
.cell[data-value="2"]{background:#eee4da}
.cell[data-value="4"]{background:#ede0c8}
.cell[data-value="8"]{background:#f2b179;color:#fff}
.cell[data-value="16"]{background:#f59563;color:#fff}
.cell[data-value="32"]{background:#f67c5f;color:#fff}
.cell[data-value="64"]{background:#f65e3b;color:#fff}
.cell[data-value="128"]{background:#edcf72;color:#fff;font-size:clamp(21px,5.5vw,34px)}
.cell[data-value="256"]{background:#edcc61;color:#fff;font-size:clamp(21px,5.5vw,34px)}
.cell[data-value="512"]{background:#edc850;color:#fff;font-size:clamp(21px,5.5vw,34px)}
.cell[data-value="1024"]{background:#edc53f;color:#fff;font-size:clamp(17px,4.7vw,28px)}
.cell[data-value="2048"]{background:#edc22e;color:#fff;font-size:clamp(17px,4.7vw,28px);box-shadow:0 0 0 3px #fff3}
.cell.high{background:#3c3a32;color:#fff;font-size:clamp(17px,4.7vw,28px)}
.overlay{position:absolute;inset:0;background:#faf8efcc;border-radius:9px;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
.overlay.show{display:flex}
.overlay h2{font-size:42px;margin:0 0 8px}
.overlay p{margin-bottom:16px}
.help{margin-top:18px;font-size:14px}
.help strong{font-weight:800}
.mobile-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:190px;margin:16px auto 0}
.mobile-controls button{padding:13px 0;font-size:20px}
.mobile-controls button:nth-child(1){grid-column:2}
.mobile-controls button:nth-child(2){grid-column:1;grid-row:2}
.mobile-controls button:nth-child(3){grid-column:2;grid-row:2}
.mobile-controls button:nth-child(4){grid-column:3;grid-row:2}
footer{margin-top:18px;font-size:12px;opacity:.8;text-align:center}
@media(min-width:600px){.mobile-controls{display:none}}
</style>
</head>
<body>
<main>
<header>
<h1>2048</h1>
<div class="scores">
<div class="scorebox"><small>SCORE</small><span id="score">0</span></div>
<div class="scorebox"><small>BEST</small><span id="best">0</span></div>
</div>
</header>

<div class="topline">
<p>数字を合わせて <strong>2048</strong> を作ろう！</p>
<button id="restart">新しく始める</button>
</div>

<section class="board-wrap" aria-label="2048 game board">
<div class="board" id="board" role="grid" aria-label="4 by 4 grid"></div>
<div class="overlay" id="overlay">
<h2 id="overlay-title">ゲーム終了</h2>
<p id="overlay-text"></p>
<button id="overlay-button">もう一度遊ぶ</button>
</div>
</section>

<div class="mobile-controls" aria-label="方向ボタン">
<button data-dir="up" aria-label="上">↑</button>
<button data-dir="left" aria-label="左">←</button>
<button data-dir="down" aria-label="下">↓</button>
<button data-dir="right" aria-label="右">→</button>
</div>

<div class="help">
<strong>遊び方：</strong>
矢印キー（スマホは方向ボタン）で盤面を動かします。同じ数字がぶつかると合体し、数字が2倍になります。1回の移動で同じタイルは1度だけ合体します。空きマスがなく、どの方向にも動けなくなるとゲームオーバーです。
</div>
<footer>2048 Number Puzzle · Your best score is saved on this device.</footer>
</main>

<script>
(() => {
 const SIZE=4;
 const boardEl=document.getElementById('board');
 const scoreEl=document.getElementById('score');
 const bestEl=document.getElementById('best');
 const overlay=document.getElementById('overlay');

 let grid,score,best=Number(localStorage.getItem('2048-best')||0),over=false,won=false;
 bestEl.textContent=best;

 const empty=()=>Array.from({length:SIZE},()=>Array(SIZE).fill(0));

 function spawn(){
   const spaces=[];
   for(let r=0;r<SIZE;r++)
     for(let c=0;c<SIZE;c++)
       if(!grid[r][c])spaces.push([r,c]);

   if(!spaces.length)return;
   const [r,c]=spaces[Math.floor(Math.random()*spaces.length)];
   grid[r][c]=Math.random()<.9?2:4;
 }

 function render(){
   boardEl.innerHTML='';
   for(let r=0;r<SIZE;r++)
     for(let c=0;c<SIZE;c++){
       const v=grid[r][c];
       const cell=document.createElement('div');
       cell.className='cell'+(v>2048?' high':'');
       cell.setAttribute('role','gridcell');
       if(v)cell.dataset.value=String(v);
       cell.textContent=v||'';
       cell.setAttribute('aria-label',v?String(v):'empty');
       boardEl.appendChild(cell);
     }
   scoreEl.textContent=score;
   bestEl.textContent=best;
 }

 function start(){
   grid=empty();
   score=0;
   over=false;
   won=false;
   overlay.classList.remove('show');
   spawn();
   spawn();
   render();
 }

 function slideLine(line){
   const values=line.filter(Boolean);
   const out=[];
   let gained=0;

   for(let i=0;i<values.length;i++){
     if(values[i]===values[i+1]){
       const merged=values[i]*2;
       out.push(merged);
       gained+=merged;
       i++;
     }else{
       out.push(values[i]);
     }
   }

   while(out.length<SIZE)out.push(0);
   return {line:out,gained};
 }

 function move(dir){
   if(over)return;

   const next=empty();
   let gained=0;

   for(let i=0;i<SIZE;i++){
     let line=[];

     for(let j=0;j<SIZE;j++)
       line.push(
         dir==='left'?grid[i][j]:
         dir==='right'?grid[i][SIZE-1-j]:
         dir==='up'?grid[j][i]:
         grid[SIZE-1-j][i]
       );

     const result=slideLine(line);
     gained+=result.gained;

     for(let j=0;j<SIZE;j++){
       const r=dir==='left'||dir==='right'?i:
               dir==='up'?j:SIZE-1-j;
       const c=dir==='up'||dir==='down'?i:
               dir==='left'?j:SIZE-1-j;
       next[r][c]=result.line[j];
     }
   }

   if(next.every((row,r)=>row.every((v,c)=>v===grid[r][c])))return;

   grid=next;
   score+=gained;

   if(score>best){
     best=score;
     localStorage.setItem('2048-best',String(best));
   }

   spawn();
   render();

   if(!won&&grid.some(row=>row.includes(2048))){
     won=true;
     showOverlay(
       '2048達成！',
       'おめでとう！続けてプレイすることもできます。',
       '続ける',
       true
     );
   }else if(!canMove()){
     over=true;
     showOverlay(
       'ゲームオーバー',
       'おつかれさま！もう一度挑戦してみよう。',
       'もう一度遊ぶ'
     );
   }
 }

 function canMove(){
   for(let r=0;r<SIZE;r++)
     for(let c=0;c<SIZE;c++){
       if(!grid[r][c])return true;
       if(c<SIZE-1&&grid[r][c]===grid[r][c+1])return true;
       if(r<SIZE-1&&grid[r][c]===grid[r+1][c])return true;
     }
   return false;
 }

 function showOverlay(title,msg,button,continueMode=false){
   document.getElementById('overlay-title').textContent=title;
   document.getElementById('overlay-text').textContent=msg;

   const b=document.getElementById('overlay-button');
   b.textContent=button;
   b.onclick=()=>{
     overlay.classList.remove('show');
     if(!continueMode)start();
   };

   overlay.classList.add('show');
 }

 const keys={
   ArrowUp:'up',
   ArrowDown:'down',
   ArrowLeft:'left',
   ArrowRight:'right',
   w:'up',
   s:'down',
   a:'left',
   d:'right'
 };

 document.addEventListener('keydown',e=>{
   if(keys[e.key]){
     e.preventDefault();
     move(keys[e.key]);
   }else if(e.key.toLowerCase()==='r'){
     start();
   }
 });

 document.getElementById('restart').addEventListener('click',start);

 document.querySelectorAll('[data-dir]').forEach(b=>
   b.addEventListener('click',()=>move(b.dataset.dir))
 );

 let touch=null;
 const wrap=document.querySelector('.board-wrap');

 wrap.addEventListener('touchstart',e=>{
   const t=e.changedTouches[0];
   touch=[t.clientX,t.clientY];
 },{passive:true});

 wrap.addEventListener('touchend',e=>{
   if(!touch)return;

   const t=e.changedTouches[0];
   const dx=t.clientX-touch[0];
   const dy=t.clientY-touch[1];
   touch=null;

   if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;

   move(
     Math.abs(dx)>Math.abs(dy)?
     (dx>0?'right':'left'):
     (dy>0?'down':'up')
   );
 },{passive:true});

 start();
})();
</script>
</body>
</html>
